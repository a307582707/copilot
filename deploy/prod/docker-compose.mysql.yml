# Optional MySQL-only overlay (binlog + Asia/Shanghai TZ).
# Default production stack already defines MySQL in docker-compose.yml;
# use this file only when you need a standalone MySQL service with these extras:
#   docker compose -f docker-compose.mysql.yml up -d
services:
  mysql:
    image: mysql:8.0
    container_name: codesprite-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-codesprite}
      MYSQL_USER: ${MYSQL_USER:-codesprite}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --log-bin=mysql-bin
      - --binlog-expire-logs-seconds=604800
    volumes:
      - ${MYSQL_DATA_DIR:-./data/mysql}:/var/lib/mysql
    networks:
      - codesprite-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

networks:
  codesprite-net:
    name: codesprite-net
