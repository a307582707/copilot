<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Billing - Cashier Step 1</title>
<style>
  :root { --bg-body: #0a0e14; --bg-card: rgba(30, 36, 50, 0.6); --primary: #7c5cff; --success: #78ffaa; --text-main: #f0f0f0; --text-dim: rgba(255, 255, 255, 0.6); --border: rgba(255, 255, 255, 0.1); }
  body { 
    background: var(--bg-body); 
    color: var(--text-main); 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    margin: 0; 
    padding: 40px; 
    display: flex; 
    justify-content: center; 
  }
  .container { width: 1000px; display: flex; flex-direction: column; gap: 24px; filter: blur(5px); pointer-events: none; }
  
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: #151b26; border: 1px solid rgba(255,255,255,0.15); width: 440px; border-radius: 20px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
  
  .step-indicator { display: flex; gap: 6px; margin-bottom: 24px; }
  .step { height: 4px; flex: 1; background: rgba(255,255,255,0.1); border-radius: 2px; }
  .step.active { background: var(--primary); }
  
  .qr-box { background: white; padding: 15px; border-radius: 12px; width: 180px; height: 180px; margin: 20px auto; display: flex; align-items: center; justify-content: center; }
  .channels { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
  .ch-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .ch-btn.active { border-color: #1677ff; color: #1677ff; background: rgba(22, 119, 255, 0.1); }
  
  .btn-primary { width: 100%; padding: 12px; border-radius: 12px; background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; font-size: 15px; }
</style>
</head>
<body>

<div class="container">
  <div style="height: 800px; background: rgba(255,255,255,0.05); border-radius: 16px;"></div>
</div>

<div class="modal-overlay">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
      <div style="font-weight: 800; font-size: 18px;">收银台</div>
      <div style="color: var(--text-dim); cursor: pointer;">✕</div>
    </div>
    
    <div class="step-indicator">
      <div class="step active"></div>
      <div class="step"></div>
      <div class="step"></div>
    </div>

    <div style="text-align: center;">
      <div style="color: var(--text-dim); font-size: 13px; margin-bottom: 8px;">支付金额</div>
      <div style="font-size: 36px; font-weight: 800; font-family: ui-monospace, monospace;">¥99.00</div>
    </div>

    <div class="qr-box">
      <svg width="150" height="150" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" fill="white"/>
        <path d="M10 10h30v30h-30z M60 10h30v30h-30z M10 60h30v30h-30z" fill="black"/>
        <path d="M45 45h10v10h-10z M20 20h10v10h-10z M70 20h10v10h-10z M20 70h10v10h-10z" fill="black"/>
      </svg>
    </div>

    <div class="channels">
      <button class="ch-btn active">
        <span>🟦</span> 支付宝
      </button>
      <button class="ch-btn">
        <span>🟩</span> 微信支付
      </button>
    </div>

    <button class="btn-primary">我已支付，下一步</button>
  </div>
</div>

</body>
</html>
