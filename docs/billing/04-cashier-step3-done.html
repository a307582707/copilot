<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Billing - Cashier Step 3 (Done & Updated)</title>
<style>
  :root { --bg-body: #0a0e14; --bg-card: rgba(30, 36, 50, 0.6); --primary: #7c5cff; --success: #78ffaa; --text-main: #f0f0f0; --text-dim: rgba(255, 255, 255, 0.6); --border: rgba(255, 255, 255, 0.1); }
  body { 
    background: var(--bg-body); 
    color: var(--text-main); 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    margin: 0; 
    padding: 40px; 
    display: flex; 
    justify-content: center; 
  }
  
  .container { width: 1000px; display: flex; flex-direction: column; gap: 24px; filter: blur(4px); transition: filter 0.3s; }
  
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
  .balance-amount { font-size: 36px; font-weight: 800; margin: 10px 0; font-family: ui-monospace, monospace; letter-spacing: -0.5px; }
  
  .balance-new { color: var(--success); text-shadow: 0 0 10px rgba(120,255,170,0.3); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: #151b26; border: 1px solid rgba(255,255,255,0.15); width: 440px; border-radius: 20px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
  
  .step-indicator { display: flex; gap: 6px; margin-bottom: 24px; }
  .step { height: 4px; flex: 1; background: rgba(255,255,255,0.1); border-radius: 2px; }
  .step.active { background: var(--primary); }
  
  .success-icon { 
    width: 64px; height: 64px; background: rgba(120, 255, 170, 0.2); border-radius: 50%; 
    display: flex; align-items: center; justify-content: center; margin: 30px auto; 
    color: var(--success); font-size: 32px; 
  }
  
  .btn-primary { width: 100%; padding: 12px; border-radius: 12px; background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; font-size: 15px; }
</style>
</head>
<body>

<div class="container">
  <div style="display:flex; justify-content:space-between; align-items:flex-end;">
    <div><h1 style="margin:0; font-size:24px;">充值中心</h1><p style="margin:5px 0 0; color:var(--text-dim);">余额可用于订阅续费及按量服务抵扣。</p></div>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
    <div class="card">
      <div style="color:var(--text-dim); font-size:12px; font-weight:bold;">当前余额</div>
      <div class="balance-amount balance-new">¥228.00</div>
      <div style="font-size:12px; color:var(--success);">刚刚收到一笔充值 (+¥99.00)</div>
    </div>
    <div class="card">
      <div style="color:var(--text-dim); font-size:12px; font-weight:bold;">订阅状态</div>
      <div style="margin:10px 0; font-size:28px; font-weight:800;">PRO</div>
    </div>
  </div>
</div>

<div class="modal-overlay">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
      <div style="font-weight: 800; font-size: 18px;">支付成功</div>
    </div>
    
    <div class="step-indicator">
      <div class="step active"></div>
      <div class="step active"></div>
      <div class="step active"></div>
    </div>

    <div class="success-icon">✓</div>
    
    <div style="text-align: center; margin-bottom: 30px;">
      <h3 style="margin: 0 0 10px;">¥99.00 已即时到账</h3>
      <p style="color: var(--text-dim); font-size: 14px; line-height: 1.5;">
        背景页面的余额已自动刷新。<br>
        您可以点击“完成”关闭此窗口。
      </p>
    </div>

    <button class="btn-primary">完成</button>
  </div>
</div>

</body>
</html>
