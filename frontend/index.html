<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/codesprite-mark.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>CodeSprite - 多模型 AI 订阅平台</title>
  </head>
  <body>
    <div
      id="boot-fallback"
      style="
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background: linear-gradient(135deg, rgb(6, 10, 20), rgb(5, 18, 14));
        color: rgba(255, 255, 255, 0.92);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        z-index: 99999;
      "
    >
      <div
        style="
          max-width: 820px;
          width: 100%;
          border-radius: 16px;
          border: 1px solid rgba(255, 255, 255, 0.1);
          background: rgba(15, 22, 33, 0.78);
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
          padding: 16px;
        "
      >
        <div style="font-size: 18px; font-weight: 850; margin-bottom: 10">正在加载…</div>
        <div id="boot-fallback-msg" style="opacity: 0.82; line-height: 1.6; white-space: pre-wrap"></div>
        <pre
          id="boot-fallback-detail"
          style="
            margin: 10px 0 0;
            border-radius: 12px;
            border: 1px solid rgba(255, 85, 85, 0.3);
            background: rgba(255, 85, 85, 0.08);
            padding: 12px;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            display: none;
          "
        ></pre>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px">
          <a
            href="/"
            style="
              padding: 8px 12px;
              border-radius: 12px;
              border: 1px solid rgba(124, 92, 255, 0.55);
              background: rgba(124, 92, 255, 0.14);
              color: rgba(255, 255, 255, 0.92);
              text-decoration: none;
              font-weight: 850;
            "
            >返回首页</a
          >
          <button
            type="button"
            onclick="location.reload()"
            style="
              padding: 8px 12px;
              border-radius: 12px;
              border: 1px solid rgba(255, 255, 255, 0.12);
              background: rgba(255, 255, 255, 0.04);
              cursor: pointer;
              color: rgba(255, 255, 255, 0.92);
              font-weight: 800;
            "
          >
            重新加载
          </button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      ;(function () {
        // Panic reset (runs BEFORE app JS): recover from bad/huge localStorage that can freeze normal sessions.
        // Usage: https://codesprite.example.com/app?reset=1
        try {
          var url = new URL(location.href)
          var sp = url.searchParams
          var reset = sp.get('reset')
          if (reset === '1' || reset === 'true') {
            // Best-effort: clear all CodeSprite/CursorLike persisted keys.
            try {
              for (var i = localStorage.length - 1; i >= 0; i--) {
                var k = localStorage.key(i) || ''
                if (k.indexOf('cursor_like_') === 0 || k.indexOf('codesprite_') === 0) localStorage.removeItem(k)
              }
            } catch (e) {}
            try {
              for (var j = sessionStorage.length - 1; j >= 0; j--) {
                var k2 = sessionStorage.key(j) || ''
                if (k2.indexOf('cursor_like_') === 0 || k2.indexOf('codesprite_') === 0) sessionStorage.removeItem(k2)
              }
            } catch (e2) {}
            // Clear any stuck drag styles.
            try {
              document.body.style.cursor = ''
              document.body.style.userSelect = ''
            } catch (e3) {}
            // Remove reset param and hard-reload via replace (avoids history pollution).
            sp.delete('reset')
            var clean = url.pathname + (sp.toString() ? '?' + sp.toString() : '') + url.hash
            location.replace(clean || '/app')
            return
          }
        } catch (e0) {}

        var el = document.getElementById('boot-fallback')
        var msgEl = document.getElementById('boot-fallback-msg')
        var detailEl = document.getElementById('boot-fallback-detail')
        function show(msg, detail) {
          try {
            if (!el) return
            el.style.display = 'flex'
            if (msgEl) msgEl.textContent = msg || '页面加载失败，请将错误信息发给管理员排查。'
            if (detailEl && detail) {
              detailEl.style.display = 'block'
              detailEl.textContent = String(detail)
            }
          } catch (e) {
            // ignore
          }
        }
        window.__hideBootFallback__ = function () {
          try {
            if (el) el.style.display = 'none'
          } catch (e) {
            // ignore
          }
        }
        window.__showBootError__ = show

        window.addEventListener(
          'error',
          function (ev) {
            // Script load errors usually have no "error" object.
            var target = ev && ev.target
            var src = target && (target.src || target.href)
            var reason = src ? '资源加载失败：' + src : (ev && ev.message) || '未知错误'
            show('页面加载发生错误。' + '\n' + reason, (ev && ev.error && (ev.error.stack || ev.error.message)) || '')
          },
          true,
        )

        window.addEventListener('unhandledrejection', function (ev) {
          var r = ev && ev.reason
          var msg = (r && (r.message || r.toString && r.toString())) || '未处理的 Promise 异常'
          show('页面加载发生异常。' + '\n' + msg, (r && r.stack) || '')
        })

        setTimeout(function () {
          if (!window.__APP_BOOTED__) show('正在加载…\n如果一直停留在此页面，请刷新或返回首页。', '')
        }, 1200)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
